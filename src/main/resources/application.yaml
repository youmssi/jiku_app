jiku:
  mail:
    # Email delivery transport: log (default — records sends without delivering,
    # so a fresh clone works with zero setup), smtp (Mailpit from docker-compose
    # locally, or any SMTP relay), resend (production HTTPS API; Render blocks
    # outbound SMTP), brevo (standalone Brevo transactional API), or routing
    # (Resend first, Brevo fallback once Resend's daily cap is hit — JIKU-62).
    transport: ${MAIL_TRANSPORT:log}
    resend:
      api-key: ${RESEND_API_KEY:}
      base-url: ${RESEND_BASE_URL:https://api.resend.com}
    brevo:
      api-key: ${BREVO_API_KEY:}
      base-url: ${BREVO_BASE_URL:https://api.brevo.com/v3}
    routing:
      # Kept comfortably under each provider's actual free-tier ceiling and
      # under their naive sum — the two free tiers are not reliably additive in
      # practice once a safety margin is applied (JIKU-62).
      resend-daily-cap: ${EMAIL_RESEND_DAILY_CAP:100}
      brevo-daily-cap: ${EMAIL_BREVO_DAILY_CAP:300}
      global-daily-cap: ${EMAIL_GLOBAL_DAILY_CAP:350}
  whatsapp:
    # WhatsApp delivery transport: log (default — records sends without
    # delivering) or meta (WhatsApp Cloud API with the credentials below).
    # Tenants can override the platform credentials with their own in the org
    # settings; these values are the fallback for tenants who bring nothing.
    transport: ${WHATSAPP_TRANSPORT:log}
    meta:
      access-token: ${WHATSAPP_META_ACCESS_TOKEN:}
      phone-number-id: ${WHATSAPP_META_PHONE_NUMBER_ID:}
      base-url: ${WHATSAPP_META_BASE_URL:https://graph.facebook.com/v21.0}
      # Approved template for business-initiated sends; blank sends plain text
      # (only reaches recipients inside the 24h customer-service window).
      template-name: ${WHATSAPP_META_TEMPLATE_NAME:}
      template-language: ${WHATSAPP_META_TEMPLATE_LANGUAGE:fr}
    # Cost/quota/category guardrails (JIKU-61).
    conversation-safety-threshold: ${WHATSAPP_CONVERSATION_SAFETY_THRESHOLD:220}
    usd-to-gnf-rate: ${WHATSAPP_USD_TO_GNF_RATE:8760}
    marketing-markers: ${WHATSAPP_MARKETING_MARKERS:promo,réduction,solde,gratuit,offre spéciale,cadeau,bon plan,code promo,achetez maintenant}
  provider-credentials:
    # Encrypts tenant-provided provider credentials at rest (AES-GCM). Minimum
    # 32 characters; MUST be set to a strong random value outside local — and
    # kept stable, since rotating it invalidates stored tenant credentials.
    encryption-key: ${PROVIDER_CREDENTIALS_ENCRYPTION_KEY:local-development-provider-credentials-key-0123456789}
  cors:
    # Comma-separated list of origins that may call this API. In development the
    # frontend runs on localhost:3000; in production set CORS_ALLOWED_ORIGINS to
    # the deployed frontend URL (e.g. https://jiku.app).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

server:
  # Per-IP rate limiting needs the real client address, not the hosting
  # platform's reverse proxy. NATIVE has the embedded server honour the
  # X-Forwarded-* headers set by the immediate (trusted) proxy.
  forwarded-headers-strategy: ${SERVER_FORWARDED_HEADERS:native}
logging:
  # Prepend the request and tenant correlation ids to every console line so a
  # request can be traced locally. In deployed environments set
  # LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs to emit JSON logs instead — the
  # correlation ids and all other MDC fields become structured fields
  # automatically, so no further pattern configuration is needed there.
  pattern:
    correlation: "[%X{requestId:-}] [%X{tenantId:-}] "

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: app
  mail:
    # SMTP endpoint used when jiku.mail.transport=smtp. Defaults target the
    # Mailpit container from docker-compose (captures mail, UI on :8025).
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  servlet:
    multipart:
      max-file-size: ${INVITATION_MAX_FILE_SIZE:10MB}
      max-request-size: ${INVITATION_MAX_FILE_SIZE:10MB}
  modulith:
    runtime:
      verification-enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway migrations, not Hibernate. Validate the mapped
      # entities against the migrated schema; never auto-generate it.
      ddl-auto: validate
  flyway:
    enabled: true
    # Skip pre-migration validation in development so new migration files (e.g.
    # V14, V15) are automatically applied to the local database on bootRun.
    # In production, validation should remain enabled to catch drift early.
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:false}
  datasource:
    # The POSTGRES_* variables are the SAME ones docker-compose.yml uses, so the
    # database the container creates and the database the app connects to cannot
    # drift. Defaults make a fresh clone run with zero configuration; override the
    # variables (e.g. POSTGRES_HOST, credentials) for any other environment.
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # 10 connections comfortably covers the MVP's expected concurrency while
      # staying well under managed-Postgres connection limits. Override per
      # environment with DB_POOL_MAX_SIZE rather than editing this file.
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}

auth:
  account:
    # Account recovery links (JIKU-49): how long a reset/verification link stays
    # valid, and the frontend origin the emailed links point at.
    password-reset-ttl: ${AUTH_PASSWORD_RESET_TTL:PT1H}
    email-verification-ttl: ${AUTH_EMAIL_VERIFICATION_TTL:P2D}
    # How long an emailed member invitation stays acceptable (JIKU-50).
    member-invitation-ttl: ${AUTH_MEMBER_INVITATION_TTL:P7D}
    app-base-url: ${SERVER_BASE_URL:http://localhost:3000}
  google:
    # OAuth client id of the Google Identity Services button (JIKU-51) — the
    # required audience of incoming ID tokens. Blank disables Google sign-in.
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    jwks-uri: ${GOOGLE_OAUTH_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}

jwt:
  # HMAC signing secret (minimum 32 bytes). The default is for local use only;
  # every real environment MUST set JWT_SECRET to a long random value.
  secret: ${AUTH_JWT_SECRET:local-development-signing-secret-not-for-production-0123456789abcd}
  access-token-expiration: ${AUTH_JWT_ACCESS_EXPIRATION:PT1H}
  refresh-token-expiration: ${AUTH_JWT_REFRESH_EXPIRATION:P7D}

api:
  # Prefix applied to every REST controller (and the security matchers). The API
  # version lives here only, so a future version is a one-line change.
  base-path: ${SERVER_API_PREFIX:/api/v1}
  rate-limit:
    # Abuse protection for every endpoint reachable without an organizer login.
    # Budgets are per client IP — plus the link token where one is in the path, so
    # a busy venue NAT does not lump every validator together and an attacker
    # cannot rotate tokens for a fresh budget. Counters are in-memory and
    # per-instance by design at MVP scale (one API replica); exceeding a budget
    # returns 429 with a Retry-After header. Paths are relative to api.base-path
    # and must not overlap across policies.
    enabled: ${RATE_LIMIT_ENABLED:true}
    policies:
      login:
        # Blunt credential brute-force: a human retries a handful of times per
        # minute, scripts do not.
        paths: [/auth/login]
        max-requests: ${AUTH_LOGIN_MAX_ATTEMPTS:5}
        window: ${AUTH_LOGIN_RATE_WINDOW:PT1M}
      auth-public:
        # Registration, token refresh and account recovery: legitimate use is rare
        # per client, but registration writes rows and recovery sends mail, so keep
        # scripted abuse slow.
        paths: [/auth/register, /auth/refresh, /auth/forgot-password, /auth/reset-password, /auth/verify-email, /auth/invitations/**, /auth/google]
        max-requests: ${RATE_LIMIT_AUTH_PUBLIC_MAX_REQUESTS:10}
        window: ${RATE_LIMIT_AUTH_PUBLIC_WINDOW:PT1M}
      rsvp:
        # A guest opens their invitation and answers once; 30/min absorbs page
        # refreshes and flaky connections while making token scanning useless.
        # Covers the RSVP view/confirm/decline and the ticket view (JIKU-21).
        paths: [/rsvp/**]
        token-segment: 1
        max-requests: ${RATE_LIMIT_RSVP_MAX_REQUESTS:30}
        window: ${RATE_LIMIT_RSVP_WINDOW:PT1M}
      checkin:
        # A busy validator scans a guest every few seconds and searches between
        # scans; 120/min per validator link is comfortable for that pace and far
        # below scripted abuse.
        paths: [/checkin/**]
        token-segment: 1
        max-requests: ${RATE_LIMIT_CHECKIN_MAX_REQUESTS:120}
        window: ${RATE_LIMIT_CHECKIN_WINDOW:PT1M}
      email-feedback:
        # Provider bounce/complaint webhooks (canonical + provider-specific
        # sub-paths): bursty after a large send but bounded; the shared secret /
        # signature is the primary gate, this caps floods.
        paths: [/notifications/email-feedback/**]
        max-requests: ${RATE_LIMIT_EMAIL_FEEDBACK_MAX_REQUESTS:300}
        window: ${RATE_LIMIT_EMAIL_FEEDBACK_WINDOW:PT1M}
      booking:
        # Public deposit-reservation flow (JIKU-55): a legitimate prospect quotes
        # and submits once, then declares one payment; keep scripted abuse slow.
        # The access token lives in the query string, not the path, so this is
        # IP-only (no token-segment) unlike rsvp/checkin.
        paths: [/bookings/**]
        max-requests: ${RATE_LIMIT_BOOKING_MAX_REQUESTS:20}
        window: ${RATE_LIMIT_BOOKING_WINDOW:PT1M}

error-tracking:
  # Unhandled-error reporting (JIKU-70). The DSN is the switch: blank — the default
  # — leaves the logging tracker in place, so a fresh clone and the test suite make
  # no outbound calls and need no provider account. Set it per environment to route
  # unhandled exceptions to the provider instead.
  dsn: ${ERROR_TRACKING_DSN:}
  environment: ${ERROR_TRACKING_ENVIRONMENT:local}
  # Must match the frontend's NEXT_PUBLIC_ERROR_TRACKING_RELEASE for the same
  # deployment, otherwise a backend event and the frontend report for the same
  # request cannot be lined up.
  release: ${ERROR_TRACKING_RELEASE:}

management:
  # Observability surface for uptime and performance monitoring (JIKU-30).
  endpoints:
    web:
      exposure:
        # health is the public liveness/readiness probe; prometheus and metrics
        # feed a performance dashboard; info reports build metadata. Override to
        # widen/narrow per environment.
        include: ${OBSERVABILITY_ENDPOINTS:health,info,metrics,prometheus}
  endpoint:
    health:
      # Kubernetes-style liveness/readiness probes; readiness fails when the
      # database is unreachable, so a monitor pinging /actuator/health/readiness
      # (or /actuator/health) flips to DOWN on a DB outage.
      probes:
        enabled: true
      # Only status (UP/DOWN) is shown to unauthenticated callers (the external
      # uptime monitor), never the internal component details.
      show-details: ${OBSERVABILITY_HEALTH_DETAILS:when-authorized}
      show-components: ${OBSERVABILITY_HEALTH_COMPONENTS:when-authorized}
  health:
    db:
      # Explicit: the readiness state must reflect database connectivity.
      enabled: true
    mail:
      # Auto-registered whenever spring.mail.host is set (always, since
      # SmtpEmailSender needs it) and pings that host over raw SMTP as part of
      # the aggregate health status — completely orthogonal to how mail
      # actually gets sent (jiku.mail.transport selects log/smtp/resend; only
      # smtp uses this host at all, and production uses resend's HTTPS API).
      # Left enabled, this makes /actuator/health — and therefore the
      # readiness probe — falsely depend on raw SMTP reachability regardless
      # of the configured transport, which is both wrong and what broke CI
      # (no Mailpit there).
      enabled: false
  metrics:
    distribution:
      # Publish latency histograms so p95/p99 and error rate are queryable for
      # the failure-sensitive paths (check-in validation, RSVP confirmation).
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s
admin:
  agreements:
    # Daily sweep marking past-end enterprise agreements EXPIRED (JIKU-43).
    cron: ${ADMIN_AGREEMENTS_CRON:0 0 4 * * *}
  bootstrap:
    # First platform administrator (JIKU-40), created idempotently at startup so a
    # fresh deployment has a working back-office. Leave both blank to skip (local
    # default); an existing account is never overwritten from config.
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}

billing:
  # Pay-per-event pricing (JIKU-32, regraded to the Guinea market grid in
  # JIKU-53: FREE/BRONZE/ARGENT/OR/CUSTOM). The free tier and paid tiers are
  # configuration, not literals in code, so pricing changes without a release.
  # Amounts are in the currency's minor unit — GNF has none, so they are the
  # full amount.
  free-tier-guests: ${BILLING_FREE_TIER_GUESTS:100}
  # Rolling window (ISO-8601 duration) over which free-tier-guests accumulates
  # per tenant account, not per event (JIKU-54) — closes the bypass of
  # fragmenting guests across many small free events.
  free-tier-window: ${BILLING_FREE_TIER_WINDOW:P365D}
  currency: ${BILLING_CURRENCY:GNF}
  custom:
    # CUSTOM tier pricing (beyond the OR tier's 1,000 guests): quoted in USD
    # cents and converted through this rate, since both move independently of a
    # release. Defaults match the GTM plan's $0.05/guest + $15 setup at
    # ~8,760 GNF/USD — revisit the rate periodically, it is not pegged.
    per-guest-usd-cents: ${BILLING_CUSTOM_PER_GUEST_USD_CENTS:5}
    setup-fee-usd-cents: ${BILLING_CUSTOM_SETUP_FEE_USD_CENTS:1500}
    usd-to-gnf-rate: ${BILLING_CUSTOM_USD_TO_GNF_RATE:8760}
  payment:
    # Mobile Money integration (JIKU-33). The active provider is a wiring choice;
    # "sandbox" makes the full flow work before a real provider is chosen. The
    # webhook secret verifies the signature on provider callbacks and MUST be set
    # to a strong value outside local.
    provider: ${PAYMENT_PROVIDER:sandbox}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:local-development-payment-webhook-secret}
    sandbox-return-url: ${PAYMENT_SANDBOX_RETURN_URL:http://localhost:3000/billing/return}
  trial:
    # Trial sweep (JIKU-42): cron for the expiry/notice job and how far before
    # expiry the organizer's heads-up email goes out.
    cron: ${BILLING_TRIAL_CRON:0 15 * * * *}
    notice-lead: ${BILLING_TRIAL_NOTICE_LEAD:P3D}
  manual:
    # Payee details shown with manual (concierge) payment instructions (JIKU-41):
    # where a client sends their prepayment. Blank fields are hidden from the
    # instructions; details flow one way (platform -> client) and no client
    # payment credential is ever collected or stored.
    payee-name: ${BILLING_MANUAL_PAYEE_NAME:}
    mobile-money-number: ${BILLING_MANUAL_MOMO_NUMBER:}
    mobile-money-operator: ${BILLING_MANUAL_MOMO_OPERATOR:}
    bank-details: ${BILLING_MANUAL_BANK_DETAILS:}
booking:
  # Deposit-reservation flow (JIKU-55): the deposit percentage, when the balance
  # falls due, and the payee details shown on the payment instructions page —
  # a distinct product surface from billing.manual above, even though the
  # underlying Mobile Money accounts may be the same.
  deposit-rate: ${BOOKING_DEPOSIT_RATE:0.30}
  balance-due-days-before-event: ${BOOKING_BALANCE_DUE_DAYS:7}
  event-timezone: ${BOOKING_EVENT_TIMEZONE:Africa/Conakry}
  payee-name: ${BOOKING_PAYEE_NAME:}
  orange-money-number: ${BOOKING_ORANGE_MONEY_NUMBER:}
  mtn-momo-number: ${BOOKING_MTN_MOMO_NUMBER:}
compliance:
  retention:
    # Data-retention policy (JIKU-37). Guest personal data is anonymized this many
    # days after an event's date; the dashboard warns notice-days ahead of that
    # cutoff. The job runs on the cron below.
    days: ${COMPLIANCE_RETENTION_DAYS:365}
    notice-days: ${COMPLIANCE_RETENTION_NOTICE_DAYS:30}
    cron: ${COMPLIANCE_RETENTION_CRON:0 30 3 * * *}

invitation:
  import:
    # Maximum number of guest rows accepted in one CSV upload.
    max-rows: ${INVITATION_MAX_ROWS:20000}
  send:
    # Frontend base URL used to build guest invitation links.
    app-base-url: ${SERVER_BASE_URL:http://localhost:3000}
    # Delivery attempts before an invitation is marked permanently FAILED.
    max-attempts: ${INVITATION_MAX_ATTEMPTS:3}
  # How often QUEUED invitations (withheld by a delivery-capacity guardrail —
  # the WhatsApp conversation window, JIKU-61, or the email routing quota,
  # JIKU-62) are retried.
  queue-sweep-cron: ${INVITATION_QUEUE_SWEEP_CRON:0 */15 * * * *}

checkin:
  validator-link:
    # Frontend base URL used to build shareable validator check-in links.
    app-base-url: ${SERVER_BASE_URL:http://localhost:3000}
    # How long a freshly issued validator link stays usable; revocation is
    # immediate and independent of this window.
    validity: ${CHECKIN_VALIDATOR_LINK_VALIDITY:P30D}

notification:
  sales:
    # Mailbox notified of new manual activation requests (JIKU-41); blank keeps
    # requests visible only in the admin payments desk.
    email: ${NOTIFICATION_SALES_EMAIL:}
  email:
    # Sender address for outbound mail. Set per environment; in production the
    # domain must be verified with the configured transport (jiku.mail.transport).
    from: ${MAIL_FROM:no-reply@jiku.app}
  send:
    # Delivery attempts before a notification is recorded as permanently failed.
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:3}
  reputation:
    # Shared secret the email provider must present on the feedback webhook.
    webhook-secret: ${NOTIFICATION_WEBHOOK_SECRET:local-development-webhook-secret}
    # Svix signing secret (whsec_…) from the Resend webhook configuration; the
    # Resend-specific endpoint rejects everything until this is set.
    resend-webhook-secret: ${RESEND_WEBHOOK_SECRET:}
    # Rolling window and alert thresholds (industry guidance: well under 5% bounce,
    # under 0.5% complaint). Optional ops address emailed when a threshold breaks.
    window-hours: ${NOTIFICATION_REPUTATION_WINDOW_HOURS:24}
    bounce-rate-threshold: ${NOTIFICATION_BOUNCE_RATE_THRESHOLD:0.05}
    complaint-rate-threshold: ${NOTIFICATION_COMPLAINT_RATE_THRESHOLD:0.005}
    undeliverable-hard-bounces: ${NOTIFICATION_UNDELIVERABLE_HARD_BOUNCES:2}
    ops-alert-email: ${NOTIFICATION_OPS_ALERT_EMAIL:}
