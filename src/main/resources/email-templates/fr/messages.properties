trial.GRANTED.subject=Votre essai {{tier}} est actif
trial.GRANTED.heading=Votre essai {{tier}} est actif
trial.GRANTED.body=Votre événement dispose de la capacité du palier {{tier}} à l'essai jusqu'au {{until}}. Réglez le palier à tout moment pendant l'essai pour la conserver.
trial.EXPIRING.subject=Votre essai {{tier}} se termine bientôt
trial.EXPIRING.heading=Votre essai se termine bientôt
trial.EXPIRING.body=Votre essai {{tier}} se termine le {{until}}. Pour garder la capacité, demandez l'activation depuis la facturation de l'événement et réglez le paiement avant cette date.
trial.EXPIRED.subject=Votre essai {{tier}} est terminé
trial.EXPIRED.heading=Votre essai est terminé
trial.EXPIRED.body=Votre essai {{tier}} s'est terminé le {{until}} et votre événement retrouve sa capacité précédente. Vous pouvez activer le palier depuis la facturation de l'événement quand vous le souhaitez.
trial.ENDED.subject=Votre essai {{tier}} a été clôturé
trial.ENDED.heading=Votre essai a été clôturé
trial.reason=\u0020: {{note}}
trial.ENDED.body=Votre essai {{tier}} a été clôturé par notre équipe{{reason}}. Contactez l'assistance pour toute question.

subscription.EXPIRING.subject=Votre abonnement {{plan}} arrive à échéance
subscription.EXPIRING.heading=Votre abonnement arrive à échéance
subscription.EXPIRING.body=Votre abonnement {{plan}} se termine le {{until}}. Renouvelez-le depuis la facturation avant cette date pour que votre espace continue de fonctionner sans interruption.
subscription.GRACE_STARTED.subject=Votre abonnement {{plan}} est en période de grâce
subscription.GRACE_STARTED.heading=Une action est nécessaire
subscription.GRACE_STARTED.body=Votre abonnement {{plan}} a expiré le {{until}}. Vous êtes en période de grâce : renouvelez-le maintenant, sinon votre espace sera suspendu le {{suspended}}.
subscription.EXPIRED.subject=Votre abonnement {{plan}} est terminé
subscription.EXPIRED.heading=Votre espace est suspendu
subscription.EXPIRED.body=Votre abonnement {{plan}} s'est terminé le {{until}} et votre espace a été suspendu le {{suspended}}. Pour le réactiver, réglez un renouvellement : notre équipe réactive dès la confirmation.
subscription.REACTIVATED.subject=Votre abonnement {{plan}} est actif
subscription.REACTIVATED.heading=Votre abonnement est de nouveau actif
subscription.REACTIVATED.body=Votre abonnement {{plan}} est actif jusqu'au {{until}}. Merci.

