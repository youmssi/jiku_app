subscription.EXPIRING.subject=Votre abonnement {{plan}} arrive à échéance
subscription.EXPIRING.heading=Votre abonnement arrive à échéance
subscription.EXPIRING.body=Votre abonnement {{plan}} se termine le {{until}}. Renouvelez-le depuis la facturation avant cette date pour que vos clients continuent de réserver sans interruption.
subscription.GRACE_STARTED.subject=Votre abonnement {{plan}} est en période de grâce
subscription.GRACE_STARTED.heading=Une action est nécessaire
subscription.GRACE_STARTED.body=Votre abonnement {{plan}} a expiré le {{until}}. Vous êtes en période de grâce : renouvelez-le maintenant, sinon les nouvelles réservations et la file du jour se mettront en pause le {{suspended}}. Vos événements ne sont pas concernés.
subscription.EXPIRED.subject=Votre abonnement {{plan}} est terminé
subscription.EXPIRED.heading=Vos services sont en pause
subscription.EXPIRED.body=Votre abonnement {{plan}} s'est terminé le {{until}}. Depuis le {{suspended}}, vos clients ne peuvent plus réserver ni prendre un ticket de file ; les rendez-vous déjà pris sont maintenus et vos événements continuent normalement. Connectez-vous et renouvelez depuis la facturation : tout reprend dès la confirmation du paiement.
subscription.REACTIVATED.subject=Votre abonnement {{plan}} est actif
subscription.REACTIVATED.heading=Votre abonnement est de nouveau actif
subscription.REACTIVATED.body=Votre abonnement {{plan}} est actif jusqu'au {{until}}. Merci.

