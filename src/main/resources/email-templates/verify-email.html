<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding:24px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                 style="max-width:480px;background:#ffffff;border-radius:12px;">
            <tr>
              <td style="padding:32px;">
                <h1 style="margin:0 0 8px;font-size:20px;color:#111111;">Verify your email address</h1>
                <p style="margin:0 0 16px;color:#444444;">
                  Welcome to Jikū! Confirm this address to unlock creating your
                  organization and inviting your team.
                </p>
                <p style="margin:0 0 24px;">
                  <a href="{{actionUrl}}"
                     style="display:inline-block;padding:12px 24px;background:#111111;color:#ffffff;
                            text-decoration:none;border-radius:8px;font-weight:bold;">
                    Verify my email
                  </a>
                </p>
                <p style="margin:0;color:#888888;font-size:13px;">
                  If you didn't create a Jikū account, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
