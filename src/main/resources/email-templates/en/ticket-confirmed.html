<p style="margin:0 0 10px;font:600 12px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:0.14em;text-transform:uppercase;color:{{primaryColor}};">Your ticket</p>
<h1 style="margin:0 0 22px;font:400 30px/1.2 Georgia,'Times New Roman',serif;color:#1d1a16;">{{eventName}}</h1>
<p style="margin:0 0 16px;">Hello {{guestName}},</p>
<p style="margin:0 0 16px;">You're confirmed. Show your ticket at the entrance: a single scan is enough, even without a network.</p>
{{eventDetails}}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0 14px;"><tr><td style="border-radius:999px;background:{{primaryColor}};"><a href="{{ticketUrl}}" style="display:inline-block;padding:14px 30px;border-radius:999px;font:600 15px/1 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#ffffff;text-decoration:none;">Show my ticket</a></td></tr></table>
{{calendarBlock}}
<p style="margin:22px 0 0;font-size:12px;line-height:1.6;color:#8c8377;">If the button doesn't work, copy this link into your browser:<br /><a href="{{ticketUrl}}" style="color:#6f665b;word-break:break-all;">{{ticketUrl}}</a></p>
