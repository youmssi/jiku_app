<h1 class="h1 ink" style="margin:0 0 10px;font:700 30px/1.15 Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:-0.025em;color:#0A0A0A;">See you soon, {{guestName}}</h1>
<p class="ink" style="margin:0 0 0px;">You're confirmed for {{eventName}}. Show this code at the door: it works only once, even offline.</p>
{{ticketCard}}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0 8px;"><tr><td class="btn" bgcolor="{{accent}}" style="border-radius:8px;background:{{accent}};"><a href="{{ticketUrl}}" style="display:inline-block;padding:16px 28px;border-radius:8px;font:600 16px/1 Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:{{onAccent}};text-decoration:none;">Show my ticket</a></td></tr></table>
{{calendarBlock}}
<p class="muted" style="margin:18px 0 0;font-size:13px;line-height:1.6;color:#737373;">If the button doesn't open, copy this address:<br /><a class="ink" href="{{ticketUrl}}" style="color:#0A0A0A;word-break:break-all;">{{ticketUrl}}</a></p>
