subscription.EXPIRING.subject=Your {{plan}} subscription expires soon
subscription.EXPIRING.heading=Your subscription expires soon
subscription.EXPIRING.body=Your {{plan}} subscription ends on {{until}}. Renew from your billing page before then so your clients keep booking without interruption.
subscription.GRACE_STARTED.subject=Your {{plan}} subscription is in grace
subscription.GRACE_STARTED.heading=Action needed
subscription.GRACE_STARTED.body=Your {{plan}} subscription expired on {{until}}. You are in a grace period: renew now, or new bookings and the day line will pause on {{suspended}}. Your events are not affected.
subscription.EXPIRED.subject=Your {{plan}} subscription has ended
subscription.EXPIRED.heading=Your services are paused
subscription.EXPIRED.body=Your {{plan}} subscription ended on {{until}}. Since {{suspended}}, clients can no longer book or take a line ticket; appointments already booked stand and your events carry on as usual. Sign in and renew from your billing page: everything resumes once the payment is confirmed.
subscription.REACTIVATED.subject=Your {{plan}} subscription is active
subscription.REACTIVATED.heading=Your subscription is active again
subscription.REACTIVATED.body=Your {{plan}} subscription is now active until {{until}}. Thank you.

