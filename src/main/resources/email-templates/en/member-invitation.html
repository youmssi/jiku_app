<p class="accent-text" style="margin:0 0 10px;font:600 12px/1.4 Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:0.12em;text-transform:uppercase;color:{{accentText}};">Team invitation</p>
<h1 class="h1 ink" style="margin:0 0 18px;font:700 30px/1.15 Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:-0.025em;color:#0A0A0A;">Join {{organizationName}}</h1>
<p class="ink" style="margin:0 0 0px;">{{inviterEmail}} invites you to join the {{organizationName}} team on Jikū as {{role}}.</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0 8px;"><tr><td class="btn" bgcolor="{{accent}}" style="border-radius:8px;background:{{accent}};"><a href="{{actionUrl}}" style="display:inline-block;padding:16px 28px;border-radius:8px;font:600 16px/1 Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:{{onAccent}};text-decoration:none;">Join the team</a></td></tr></table>
<p class="soft ink" style="margin:20px 0 16px;padding:14px 16px;border:1px solid #E5E5E5;border-radius:10px;background:#FAFAFA;color:#262626;font-size:14px;line-height:1.6;">Use the address this email was sent to when you sign in or create your account.</p>
<p class="muted" style="margin:18px 0 0;font-size:13px;line-height:1.6;color:#737373;">If the button doesn't open, copy this address:<br /><a class="ink" href="{{actionUrl}}" style="color:#0A0A0A;word-break:break-all;">{{actionUrl}}</a></p>
