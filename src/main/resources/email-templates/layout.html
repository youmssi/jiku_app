<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>{{brandName}}</title>
  </head>
  <body style="margin:0;padding:0;background:#f6f3ee;-webkit-text-size-adjust:100%;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;">{{preheader}}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f6f3ee;">
      <tr>
        <td align="center" style="padding:36px 16px 40px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
            <tr>
              <td align="left" style="padding:0 6px 18px;">
                {{logoBlock}}
                <p style="margin:0;font:600 12px/1.4 Georgia,'Times New Roman',serif;letter-spacing:0.16em;text-transform:uppercase;color:#6f665b;">{{brandName}}</p>
              </td>
            </tr>
            <tr>
              <td style="background:#ffffff;border:1px solid #ebe5da;border-radius:20px;overflow:hidden;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="height:6px;line-height:6px;font-size:0;background:{{primaryColor}};">&nbsp;</td>
                  </tr>
                  <tr>
                    <td style="padding:40px 36px 36px;font:16px/1.65 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#2a2621;">
                      {{content}}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:22px 12px 0;font:12px/1.7 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#8c8377;">
                {{footer}}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
