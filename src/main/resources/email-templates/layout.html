<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>{{brandName}}</title>
    <style>
      :root { color-scheme: light dark; supported-color-schemes: light dark; }
      body { margin: 0; padding: 0; }
      .on-dark { display: none; }
      @media (max-width: 620px) {
        .px { padding-left: 22px !important; padding-right: 22px !important; }
        .h1 { font-size: 26px !important; }
      }
      @media (prefers-color-scheme: dark) {
        .bg { background: #0A0A0A !important; }
        .card { background: #171717 !important; border-color: #262626 !important; }
        .ink { color: #FAFAFA !important; }
        .muted { color: #A3A3A3 !important; }
        .line { border-color: #262626 !important; }
        .soft { background: #0A0A0A !important; border-color: #262626 !important; }
        .accent-text { color: #E5E5E5 !important; }
        .btn { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.28) !important; }
        .hd { box-shadow: inset 0 -1px 0 rgba(255,255,255,0.12) !important; }
        .on-light { display: none !important; }
        .on-dark { display: inline-block !important; }
      }
    </style>
  </head>
  <body class="bg" style="margin:0;padding:0;background:#FAFAFA;-webkit-text-size-adjust:100%;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;">{{preheader}}&#8202;&#847;&#8202;&#847;&#8202;&#847;&#8202;&#847;&#8202;&#847;</div>
    <table role="presentation" class="bg" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#FAFAFA;">
      <tr>
        <td align="center" style="padding:32px 12px 40px;">
          <table role="presentation" class="card" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background:#FFFFFF;border:1px solid #E5E5E5;border-radius:14px;border-collapse:separate;">
            <tr>
              <td class="px hd" bgcolor="{{accent}}" style="background:{{accent}} url('{{watermarkUrl}}') repeat;background-size:88px 88px;padding:28px 36px 14px;border-radius:13px 13px 0 0;">
                {{headerBlock}}
                <img src="{{bandeUrl}}" width="528" height="30" alt="" style="display:block;margin-top:24px;width:100%;max-width:528px;height:auto;border:0;" />
              </td>
            </tr>
            <tr>
              <td class="px ink" style="padding:34px 36px 36px;font:400 16px/1.65 Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0A0A0A;">
                {{content}}
              </td>
            </tr>
          </table>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">
            <tr>
              <td class="muted" align="center" style="padding:22px 24px 0;font:400 12px/1.7 Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#737373;">
                {{footer}}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
