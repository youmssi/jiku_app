<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding:24px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                 style="max-width:480px;background:#ffffff;border-radius:12px;">
            <tr>
              <td style="padding:32px;">
                {{logoBlock}}
                <h1 style="margin:0 0 8px;font-size:20px;color:#111111;">{{eventName}}</h1>
                <p style="margin:0 0 16px;color:#444444;">Hi {{guestName}},</p>
                <p style="margin:0 0 16px;color:#444444;">
                  {{organizerName}} has invited you. Tap below to confirm your attendance.
                </p>
                {{eventDetails}}
                <p style="margin:24px 0;">
                  <a href="{{invitationUrl}}"
                     style="background:{{primaryColor}};color:#ffffff;text-decoration:none;
                            padding:12px 24px;border-radius:8px;display:inline-block;font-weight:bold;">
                    View your invitation
                  </a>
                </p>
                <p style="margin:0;color:#888888;font-size:12px;">
                  If the button doesn't work, copy this link into your browser:<br />
                  {{invitationUrl}}
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
