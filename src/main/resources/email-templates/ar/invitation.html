<h1 class="h1 ink" style="margin:0 0 18px;font:700 30px/1.3 Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0A0A0A;">{{eventName}}</h1>
<p class="ink" style="margin:0 0 14px;">مرحبًا {{guestName}}،</p>
<p class="ink" style="margin:0 0 0px;">يسعد {{organizerName}} أن يدعوك. أخبرنا إن كنت ستحضر: تصلك تذكرتك الشخصية فورًا.</p>
{{eventDetails}}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0 8px;"><tr><td class="btn" bgcolor="{{accent}}" style="border-radius:8px;background:{{accent}};"><a href="{{invitationUrl}}" style="display:inline-block;padding:16px 28px;border-radius:8px;font:600 16px/1 Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:{{onAccent}};text-decoration:none;">الرد على الدعوة</a></td></tr></table>
<p class="muted" style="margin:18px 0 0;font-size:13px;line-height:1.6;color:#737373;">هذا الرابط خاص بك: لا تُعِد إرساله. إذا لم يفتح الزر، انسخ هذا العنوان:<br /><a class="ink" dir="ltr" href="{{invitationUrl}}" style="color:#0A0A0A;word-break:break-all;">{{invitationUrl}}</a></p>
