<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding:24px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                 style="max-width:480px;background:#ffffff;border-radius:12px;">
            <tr>
              <td style="padding:32px;">
                <h1 style="margin:0 0 8px;font-size:20px;color:#111111;">Join {{organizationName}}</h1>
                <p style="margin:0 0 16px;color:#444444;">
                  {{inviterEmail}} invited you to join <strong>{{organizationName}}</strong>
                  on Jikū as <strong>{{role}}</strong>.
                </p>
                <p style="margin:0 0 24px;">
                  <a href="{{actionUrl}}"
                     style="display:inline-block;padding:12px 24px;background:#111111;color:#ffffff;
                            text-decoration:none;border-radius:8px;font-weight:bold;">
                    Accept the invitation
                  </a>
                </p>
                <p style="margin:0;color:#888888;font-size:13px;">
                  The invitation expires after a few days. If you weren't expecting it,
                  you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
