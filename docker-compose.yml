# Backing infrastructure for local development (PostgreSQL, Mailpit).
# The application runs natively (`./gradlew bootRun`); only the services it
# depends on run here. The app now uses the single DATABASE_URL variable (see
# application.yaml); this compose file uses separate Docker-native POSTGRES_*
# defaults that match the default DATABASE_URL in .env.example. Start with:
#
#   docker compose up -d
#   ./gradlew bootRun
#
# Override the defaults below in a .env if you need different credentials.
name: jiku
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-jiku}
      POSTGRES_USER: ${DATABASE_USERNAME:-jiku}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-jiku}
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-jiku} -d ${DATABASE_NAME:-jiku}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local mail catcher: accepts SMTP on 1025 and shows captured messages in a web
  # UI on 8025. Point the email notification adapter at this SMTP endpoint for local
  # flow testing so invitations are captured here instead of being sent for real.
  mailpit:
    image: axllent/mailpit:latest
    container_name: jiku-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
      - "${MAILPIT_UI_PORT:-8025}:8025" # web UI — http://localhost:8025

volumes:
  pgdata:

networks:
  default:
    name: jiku-network
