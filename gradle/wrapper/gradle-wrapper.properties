distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-bin.zip
# Distribution download tolerances: the default 10s read timeout aborts the
# whole build on a slow route to services.gradle.org (seen in container builds);
# a generous timeout plus retries makes wrapper bootstrap resilient.
networkTimeout=120000
retries=3
retryBackOffMs=1000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
