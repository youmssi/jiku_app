# Production deployment (JIKU-60): a single Hetzner-style host running exactly
# two containers — the app (built from the existing Dockerfile) and Caddy, which
# terminates TLS automatically (Let's Encrypt) and reverse-proxies to the app.
# There is no Postgres service here: production runs against managed Neon
# Postgres via DATABASE_URL, same variable the app already reads locally.
#
# Deploy with:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Configuration is entirely env-driven via .env (copy .env.example, fill in the
# REQUIRED section plus API_DOMAIN/CADDY_EMAIL below). See docs/deploy.md for the
# full walkthrough from a bare server to a passing smoke test.
name: jiku-prod
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Required here so a missing secret stops the deploy instead of the API
      # falling back to a development value (the API also refuses to start).
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET to at least 32 random bytes}
      PROVIDER_CREDENTIALS_ENCRYPTION_KEY: ${PROVIDER_CREDENTIALS_ENCRYPTION_KEY:?set PROVIDER_CREDENTIALS_ENCRYPTION_KEY}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?set PAYMENT_WEBHOOK_SECRET}
      NOTIFICATION_WEBHOOK_SECRET: ${NOTIFICATION_WEBHOOK_SECRET:?set NOTIFICATION_WEBHOOK_SECRET}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
    name: jiku-prod-network
