name: Backend CI

on:
  # Aucun filtre de branche cible : une PR empilée sur une autre branche de
  # fonctionnalité doit être vérifiée comme les autres. Le filtre précédent
  # ([develop, main]) laissait ces PR fusionner sans aucune exécution — constaté
  # sur JIKU-72, qui a fusionné sans que la CI ne tourne une seule fois.
  pull_request:
  # La fusion elle-même est vérifiée : c'est le commit qui part en production,
  # et ce n'est pas celui qui a été testé sur la PR.
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint, test, verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Compiles, runs ktlint, runs the unit tests, and runs the Spring Modulith
      # architecture verification. Integration tests use Testcontainers; the
      # GitHub-hosted runner provides a running Docker daemon for PostgreSQL.
      - name: Build, lint, and test (includes module-boundary verification)
        run: ./gradlew build --no-daemon

      - name: Verify code coverage (70% minimum on business logic)
        run: ./gradlew koverVerify --no-daemon

  # Garde-fou de déploiement (JIKU-80). Deux suites unitaires vertes ne prouvent
  # rien du câblage entre elles : c'est ainsi que le produit a eu un e-mail de
  # vérification que personne n'avait jamais cliqué dans un test.
  #
  # Seul le sous-ensemble @smoke tourne ici — un cas porteur par parcours. La
  # suite complète est trop lente pour bloquer chaque PR, et le sous-ensemble
  # attrape la classe de panne qui compte : le service qui ne démarre pas, la
  # page qui ne rend pas, l'e-mail qui ne part pas.
  e2e:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: app

      # La suite pilote la pile réelle : elle a besoin des deux dépôts. Le dépôt
      # frontend est public, donc le jeton par défaut suffit à le cloner.
      #
      # Pas de continue-on-error : sans frontend, la suite ne peut rien prouver.
      # Échouer ici, en disant pourquoi, vaut mieux qu'échouer cinq minutes plus
      # tard sur un symptôme sans rapport.
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: youmssi/jiku_web
          path: web
          ref: develop

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # La version vient du `packageManager` du frontend : dupliquer un numéro
      # ici le ferait diverger silencieusement du dépôt qu'il sert à construire.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Every journey, not only @smoke: the whole suite runs in about a minute,
      # and a journey left out of CI goes stale without anyone noticing.
      - name: Run the end-to-end journeys against the real stack
        working-directory: app
        env:
          E2E_WEB_DIR: ${{ github.workspace }}/web
        run: |
          chmod +x ./gradlew ./scripts/run-e2e.sh
          ./scripts/run-e2e.sh

      # Un échec sans trace se rediagnostique à l'aveugle. Le rapport Playwright
      # porte la capture, la trace et la vidéo du moment exact de la rupture.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/e2e/playwright-report
          retention-days: 7
