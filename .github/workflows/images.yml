name: Container image

# Builds the API image on every merge to `main` and publishes it to GHCR
# (ADR 107). The server only pulls it: it never compiles. When the Dokploy
# deploy hook is configured, the new image is rolled out and the readiness
# probe is checked; without it, this only publishes.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: container-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish the API image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Roll out on the server
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.DEPLOY_TARGET == 'vps' }}
    steps:
      - name: Trigger the Dokploy deployment
        env:
          HOOK: ${{ secrets.DOKPLOY_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::DEPLOY_TARGET=vps but the DOKPLOY_DEPLOY_HOOK secret is missing." >&2
            exit 1
          fi
          # Dokploy only rolls out a GitHub-sourced compose for a push to its own
          # branch: an empty POST answers 301 "Branch Not Match" and deploys nothing.
          code=$(curl -s -o hook-response.json -w '%{http_code}' --max-time 30 -X POST "$HOOK" \
            -H 'Content-Type: application/json' -H 'X-GitHub-Event: push' \
            --data "{\"ref\":\"${GITHUB_REF}\",\"head_commit\":{\"message\":\"${GITHUB_REPOSITORY} ${GITHUB_SHA::7}\"}}" || true)
          cat hook-response.json 2>/dev/null; echo
          if [ "$code" != "200" ]; then
            echo "::error::Dokploy answered HTTP $code: the rollout did not start." >&2
            exit 1
          fi

      # Same probe as post-deploy.yml: the database must be reachable, not just the process.
      - name: Wait for readiness
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          sleep 60
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null --max-time 20 -w '%{http_code}' "$API_URL/actuator/health/readiness" || true)
            [ "$code" = "200" ] && echo "Ready." && exit 0
            echo "Attempt $attempt: readiness HTTP $code, retrying in 20 s"
            sleep 20
          done
          echo "::error::The API is not ready 10 minutes after the rollout. Roll back from Dokploy (see docs/runbooks/incident-and-rollback.md)." >&2
          exit 1
